<!DOCTYPE html>
<html>
  <head>
    <title>Reference</title>
  </head>
  <body>
    <h1>Reference</h1>

    <p><strong>Reference title:</strong> {{ reference.name if reference else "Not defined"}}</p>
    <p><strong>Reference type:</strong> {{ reference.type if reference else "Not defined"}}</p>
    <p><strong>Author:</strong> {{ reference.author if reference else "Not defined" }}</p>
    <p><strong>Publish Year:</strong> {{ reference.publish_year if reference else "Not defined" }}</p>
  </body>
</html>
