<!DOCTYPE html>
<html>
  <head>
    <title>Reference</title>
  </head>
  <body>
    <h1>Reference</h1>
    {% for info, value in reference.items() %}
    <p><strong>{{info | field_label}}</strong>: {{ value }}</p>
    {% endfor %}

    <h2>BibTeX for Overleaf</h2>
    <pre><code>{{ bibtex }}</code></pre>
  </body>
</html>
