<!DOCTYPE html>
<html>
  <head>
    <title>Add reference</title>
  </head>
  <body>
    <h1>Add reference</h1>
    {% if error %}
      <p role="alert">{{ error }}</p>
    {% endif %}
    <form method="GET" action="/create">
      <label for="reference_type">Reference type:</label>
      <select id ="reference_type" name="type" required onchange="this.form.requestSubmit()">
          <option value="">Select a reference type</option>
          {% for type in entry_types %}
          {% if type == type_input %}
          <option value="{{ type }}" selected>{{ type }}</option>
          {% else %}
          <option value="{{ type }}">{{ type }}</option>
          {% endif %}
          {% endfor %}
      </select>
    </form>
    {% if fields %}
    <form method="POST" action="/create">
      <input type="hidden" name="type" value="{{ type_input }}">
      {% for field in fields.required + fields.optional %}
        <label for="{{ field }}">{{ field | field_label }}</label>
        <input
          id="{{ field }}"
          name="{{ field }}"
          value="{{ form_values.get(field, '') }}"
          {% if field == 'publish_year' %}
            type="text" inputmode="numeric" pattern="[0-9]{1,4}"
            title="Enter a year using one to four digits"
          {% elif field == 'url' %}
            type="url"
          {% elif field == 'access_date' %}
            type="date"
          {% else %}
            type="text"
          {% endif %}
          {% if field in fields.required %}required{% endif %}
        >
      {% endfor %}

      <button type="submit">Add Reference</button>
    </form>
    {% endif %}

  </body>
