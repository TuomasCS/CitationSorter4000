[project]
name = "citationsorter4000"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromium>=0.0.0",
    "coverage>=7.17.3",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "pylint>=4.1.4",
    "robotframework-browser>=21.0.0",
    "robotframework-browser-batteries>=21.0.0",
]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "unused-import",
    "unused-variable",
    "undefined-variable",
    "redefined-outer-name",
    "broad-exception-caught",
]
